name: CAP CI

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'db/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cap-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax check API
        run: node --check server/index.mjs
      - name: Syntax check repository
        run: node --check db/repository.mjs
      - name: Build Command Center
        run: npm run build
