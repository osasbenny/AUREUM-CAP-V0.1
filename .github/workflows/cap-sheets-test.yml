name: CAP Sheets Tests
on:
  push:
    branches: [main, feature/google-sheets-sync]
    paths: ['scripts/sync-acquisition-to-sheets.mjs', 'scripts/acquisition-qualification.mjs', 'scripts/discovery-overpass.mjs', 'scripts/autonomous-acquisition-lane.mjs', 'scripts/archive-acquisition-artifacts.py', 'scripts/materialize-cap-ledger.py', 'scripts/setup-cap-sheets-gcp.sh', 'tests/**', '.github/workflows/cap-sheets-*.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/sync-acquisition-to-sheets.mjs', 'scripts/acquisition-qualification.mjs', 'scripts/discovery-overpass.mjs', 'scripts/autonomous-acquisition-lane.mjs', 'scripts/archive-acquisition-artifacts.py', 'scripts/materialize-cap-ledger.py', 'scripts/setup-cap-sheets-gcp.sh', 'tests/**', '.github/workflows/cap-sheets-*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sheets-sync.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_ledger.py'
      - run: bash -n scripts/setup-cap-sheets-gcp.sh
      - run: python3 -m py_compile scripts/archive-acquisition-artifacts.py scripts/materialize-cap-ledger.py
